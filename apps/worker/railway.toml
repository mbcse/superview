[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "apps/worker/**",
  "packages/**",
  "deploy/railway/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
startCommand = "sh /app/deploy/railway/start.sh worker"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
