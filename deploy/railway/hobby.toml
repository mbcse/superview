# One compute box: API + worker. Cheapest Hobby layout.
# In Railway: Config file path = /deploy/railway/hobby.toml
# Leave Root Directory empty so the Dockerfile path resolves.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "apps/worker/**",
  "packages/**",
  "deploy/railway/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
startCommand = "sh /app/deploy/railway/start.sh all"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
